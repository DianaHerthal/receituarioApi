spring.application.name=receituario-api

spring.mongodb.uri=mongodb://localhost:27017/receituario_db
spring.mongodb.database=receituario_db

server.port=8084

spring.devtools.restart.enabled=false

logging.level.root=INFO
logging.level.br.edu.utfpr.td.tsi=DEBUG
logging.level.org.springframework.data.mongodb.core=WARN
logging.level.org.mongodb.driver=WARN

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

logging.file.name=logs/sistema-saude.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7